# Builds Hotel Paradiso into ScummVM's WebAssembly port and publishes it to
# GitHub Pages, so the game plays in a browser.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

name: Web build (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # to push the smoke-test screenshots to their own branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # A pinned ScummVM commit with the current Emscripten port
  SCUMMVM_REF: 21955df19b580dad2807ec55f573b5f348690a81
  EMSDK_VERSION: "4.0.10"
  # Only the SCUMM engine (v6 is part of it), built in, no extra codecs
  SCUMMVM_CONFIGURE: --enable-release --disable-all-engines --enable-engine=scumm --disable-cloud --disable-libcurl --disable-sdlnet

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4

      - name: Check out ScummVM
        uses: actions/checkout@v4
        with:
          repository: scummvm/scummvm
          ref: ${{ env.SCUMMVM_REF }}
          path: scummvm

      - name: Cache the Emscripten SDK
        uses: actions/cache@v4
        with:
          path: scummvm/dists/emscripten/emsdk-*
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Build ScummVM for the web
        working-directory: scummvm
        run: |
          set -o pipefail
          report() {   # on failure, surface the end of the log as an annotation
            echo "::error title=Web build failed::$(tail -40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
          dists/emscripten/build.sh configure ${SCUMMVM_CONFIGURE} 2>&1 | tee build.log || report
          dists/emscripten/build.sh make dist 2>&1 | tee build.log | grep -v '^em++\|^emcc\|^ *C++ \|^ *CXX ' || true
          test -f build-emscripten/scummvm.wasm || report

      - name: Add the game and the landing page
        run: |
          site=scummvm/build-emscripten
          mkdir -p $site/data/games/hotel-paradiso
          cp hotel-paradiso-scummc/dist/tentacle.000 hotel-paradiso-scummc/dist/tentacle.001 \
             $site/data/games/hotel-paradiso/
          # the data folder is served over HTTP from an index; rebuild it with the game in
          python3 scummvm/dists/emscripten/build-make_http_index.py $site/data
          cp hotel-paradiso-scummc/web/index.html $site/index.html
          # Browser fixes ScummVM's page needs, loaded before anything else (see web/compat.js)
          sed -i 's#<head>#<head><script src="compat.js"></script>#' $site/scummvm.html
          cp hotel-paradiso-scummc/web/compat.js $site/compat.js
          grep -c 'compat.js' $site/scummvm.html
          python3 -c "from PIL import Image" 2>/dev/null || pip install --quiet pillow
          python3 -c "import sys; sys.path.insert(0, 'hotel-paradiso-scummc/tools'); import art; from PIL import Image; art.render_title().resize((960, 432), Image.NEAREST).save('$site/title.png')"
          touch $site/.nojekyll
          du -sh $site; ls -la $site

      - name: Smoke test in headless Chromium
        run: |
          cd scummvm/build-emscripten && python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          npm install --no-save --silent playwright@1.47.2
          npx playwright install --with-deps chromium firefox >/dev/null
          node hotel-paradiso-scummc/web/smoke-test.mjs http://localhost:8000/ smoke-test chromium
          node hotel-paradiso-scummc/web/smoke-test.mjs http://localhost:8000/ smoke-test firefox || echo "::warning::Firefox smoke test failed"
          tail -30 smoke-test/chromium-console.txt smoke-test/firefox-console.txt

      - name: Publish smoke-test screenshots to the smoke-test branch
        if: always()
        run: |
          [ -d smoke-test ] || exit 0
          cd smoke-test
          git init -q -b smoke-test
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Smoke test for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" smoke-test

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: scummvm/build-emscripten

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
